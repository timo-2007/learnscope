name: Deploy to Production (main)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.MAIN_STRATO_SFTP_USERNAME }}
          password: ${{ secrets.MAIN_STRATO_SFTP_PASSWORD }}
          server: ${{ secrets.STRATO_SFTP_HOST }}
          port: ${{ secrets.STRATO_SFTP_PORT }}
          local_path: './www/*'
          remote_path: '/'
          sftp_only: true

      - name: Deploy .htaccess (dotfiles are skipped by the glob above)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.MAIN_STRATO_SFTP_USERNAME }}
          password: ${{ secrets.MAIN_STRATO_SFTP_PASSWORD }}
          server: ${{ secrets.STRATO_SFTP_HOST }}
          port: ${{ secrets.STRATO_SFTP_PORT }}
          local_path: './www/.htaccess'
          remote_path: '/'
          sftp_only: true
