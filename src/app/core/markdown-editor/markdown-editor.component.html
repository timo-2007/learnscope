<div #editorEl></div>

<ion-modal [isOpen]="formulaModalOpen()" (didDismiss)="formulaModalOpen.set(false)" class="formula-modal">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Formel einfügen</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="formulaModalOpen.set(false)">Abbrechen</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <div #formulaPreview class="formula-preview"></div>

      <ion-item lines="full">
        <ion-input
          label="LaTeX"
          labelPlacement="stacked"
          placeholder="z.B. \frac{1}{2}"
          [ngModel]="formulaSource()"
          (ngModelChange)="onFormulaInput($event)"
        ></ion-input>
      </ion-item>

      <ion-button expand="block" (click)="insertFormula()">Einfügen</ion-button>
    </ion-content>
  </ng-template>
</ion-modal>
