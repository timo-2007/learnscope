<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
      <ion-back-button [defaultHref]="'/modules/' + moduleId"></ion-back-button>
    </ion-buttons>
    <ion-title>Topics</ion-title>
    <ion-buttons slot="end">
      <app-auth-button></app-auth-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    @for (topic of topics(); track topic.id) {
      <ion-item [routerLink]="['/modules', moduleId, subjectId, topic.id]" button>
        <ion-label>{{ topic.title }}</ion-label>
      </ion-item>
    } @empty {
      <ion-item>
        <ion-label color="medium">Noch keine Topics vorhanden.</ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
