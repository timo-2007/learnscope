<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
      <ion-back-button defaultHref="/modules"></ion-back-button>
    </ion-buttons>
    <ion-title>Subjects</ion-title>
    <ion-buttons slot="end">
      <app-auth-button></app-auth-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    @for (subject of subjects(); track subject.id) {
      <ion-item lines="full" [routerLink]="['/modules', moduleId, subject.id]" button>
        <ion-label>{{ subject.title }}</ion-label>
      </ion-item>
    } @empty {
      <ion-item lines="full">
        <ion-label color="medium">Noch keine Subjects vorhanden.</ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
