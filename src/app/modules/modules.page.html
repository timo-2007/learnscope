<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Modules</ion-title>
    <ion-buttons slot="end">
      <app-auth-button></app-auth-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Modules</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    @for (module of modules(); track module.id) {
      <ion-item lines="full" [routerLink]="['/modules', module.id]" button>
        <ion-label>{{ module.title }}</ion-label>
      </ion-item>
    } @empty {
      <ion-item lines="full">
        <ion-label color="medium">Noch keine Module vorhanden.</ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
